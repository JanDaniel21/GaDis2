<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GaDIS - View Mandate</title>

  <link rel="stylesheet" href="Table-Style.css">
  <link rel="stylesheet" href="global-style.css">
  <link rel="stylesheet" href="nav-style.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore-compat.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // 🔹 Initialize Firebase
      const firebaseConfig = {
        apiKey: "AIzaSyAQkgQZOvFJ4bTU9ys5pS0cg8QVAbCpRDE",
        authDomain: "gadis-8a320.firebaseapp.com",
        projectId: "gadis-8a320",
        storageBucket: "gadis-8a320.firebasestorage.app",
        messagingSenderId: "306615637491",
        appId: "1:306615637491:web:aaba8925f0792d1adeee86",
        measurementId: "G-T752R0LCDM"
      };

      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      console.log("✅ Firestore initialized");

      // 🔹 Create Quarter Selector
      const mainBody = document.querySelector(".main-body");
      const quarterSelector = document.createElement("div");
      quarterSelector.innerHTML = `
        <label for="quarterSelect" style="font-weight: bold;">Select Quarter:</label>
        <select id="quarterSelect" style="margin-left: 10px; padding: 4px;">
          <option value="quarter-1">Quarter 1</option>
          <option value="quarter-2">Quarter 2</option>
          <option value="quarter-3">Quarter 3</option>
          <option value="quarter-4">Quarter 4</option>
        </select>
      `;
      mainBody.prepend(quarterSelector);

      // 🔹 Wait for Firebase Authentication
      firebase.auth().onAuthStateChanged(async (user) => {
        if (!user) {
          alert("⚠️ You must be logged in to access this page.");
          window.location.href = "index.html"; // redirect to login
          return;
        }

        const uid = user.uid;
        console.log("✅ Logged in as:", user.email);

        // 🔹 Fetch user's department/college info
        let userDept = "Unknown Department";
        try {
          const userDoc = await db.collection("accounts").doc(uid).get();
          if (userDoc.exists) {
            userDept = userDoc.data().college || "Unknown Department";
          }
        } catch (error) {
          console.error("Error fetching user department:", error);
        }

        // 🔹 Fetch Mandates
        console.log("Fetching mandates...");
        const mandatesSnapshot = await db.collection("mandates").get();

        const tableBody = document.getElementById("mandateBody");
        tableBody.innerHTML = "";

        mandatesSnapshot.forEach((doc) => {
          const data = doc.data();
          const mandateId = doc.id;

          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${data["Gad Mandate"] || ""}</td>
            <td>${data["Cause"] || ""}</td>
            <td><input type="text" placeholder="Budget"></td>
            <td><input type="text" placeholder="Status"></td>
            <td><input type="text" placeholder="HGDG Score"></td>
            <td><input type="text" placeholder="Office"></td>
            <td><input type="text" placeholder="Faculty"></td>
            <td><button class="submit-report" data-id="${mandateId}">Submit</button></td>
          `;
          tableBody.appendChild(row);
        });

        // 🔹 Handle Report Submission
        document.addEventListener("click", async (e) => {
          if (e.target.classList.contains("submit-report")) {
            const mandateId = e.target.dataset.id;
            const selectedQuarter = document.getElementById("quarterSelect").value;
            const row = e.target.closest("tr");
            const inputs = row.querySelectorAll("input");
            const [budget, status, hgdg, office, faculty] = [...inputs].map(i => i.value.trim());

            const reportData = {
              budget,
              status,
              hgdg,
              office,
              faculty,
              mandateId,
              quarter: selectedQuarter,
              department: userDept,
              userEmail: user.email,
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
              await db
                .collection("reports")
                .doc(`${uid}-rep`)
                .collection(selectedQuarter)
                .doc(mandateId)
                .set(reportData);

              alert(`✅ Report for ${selectedQuarter.toUpperCase()} submitted successfully!`);
            } catch (error) {
              console.error("❌ Error submitting report:", error);
              alert("Failed to submit report. Check console for details.");
            }
          }
        });
      });
    });
  </script>
</head>

<body>
  <div class="header">
    <img src="nbg-gdis.png">
    <div class="title_header">
      <p>Republic of the Philippines</p>
      <h1>GENDER AND DEVELOPMENT</h1>
      <p>West Visayas State University Branch</p>
      <h3>Information System</h3>
    </div>
    <img src="nbg-wvsu.png">
  </div>

  <div id="navbar">
    <a href="dashboard.html">Dashboard</a>
    <a href="Accounts-page.html">Account</a>
    <a class="active" href="mandate_table.html">Mandate</a>
    <a href="report_log.html">Report</a>
  </div>

  <div class="main-body">
    <div class="table-holder">
      <h1 class="report-title">Mandate Table</h1>
      <hr>
      <table>
        <colgroup>
          <col style="width:20%;">
          <col style="width:25%;">
          <col style="width:10%;">
          <col style="width:10%;">
          <col style="width:10%;">
          <col style="width:10%;">
          <col style="width:10%;">
          <col style="width:5%;">
        </colgroup>

        <thead>
          <tr class="table-header">
            <th>GAD Mandate</th>
            <th>Cause</th>
            <th>Budget</th>
            <th>Status</th>
            <th>HGDG Score</th>
            <th>Office</th>
            <th>Faculty</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="mandateBody">
          <!-- Mandates will be dynamically added -->
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
